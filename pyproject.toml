[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chiyo-cli"
version = "0.1.2"
description = "A collection of small search-oriented command-line tools."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "tomli; python_version < '3.11'",
]
license = { file = "LICENSE" }
authors = [
  { name = "chiyo" },
]
keywords = ["cli", "fzf", "macos", "productivity", "search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]

[project.scripts]
chiyo = "chiyo_cli.cli:main"

[tool.setuptools.packages.find]
include = ["chiyo_cli", "chiyo_cli.*"]
